<body>

<div class="container">
    <h1>Playground <span>HSL</span> vs <span>OKLCH</span></h1>

    <!-- DIAL CENTRAL SUPERIOR -->
    <div class="dial-section">
        <div class="dial-wrapper" id="dialWrapper">
            <div class="ring hsl-ring" id="hslRing"></div>
            <div class="ring-label label-hsl">HSL</div>
            <div class="ring-gap"></div>
            <div class="ring oklch-ring" id="oklchRing"></div>
            <div class="ring-label label-oklch">OKLCH</div>
            
            <div class="pointer" id="pointer">
                <div class="pointer-line"></div>
            </div>
            
            <div class="center-hub">
                <span id="angleDisplay">0°</span>
                <small>HUE (HSL)</small>
            </div>
        </div>
        <div class="dial-info">Arrastra el dial para cambiar el Tono (Hue) sincronizadamente</div>
    </div>

    <!-- PANELES INFERIORES -->
    <div class="panels-grid">
        
        <!-- Panel HSL -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">HSL</h2>
                <div class="panel-code" id="hslCode">hsl(0, 65%, 50%)</div>
            </div>
            <div class="color-display" id="hslPreview"></div>
            
            <div class="control-group">
                <div class="control-label">Tono (Hue) <span id="hslHueVal">0°</span></div>
                <input type="range" id="hslHueSlider" min="0" max="360" value="0">
            </div>
            <div class="control-group">
                <div class="control-label">Saturación <span id="hslSatVal">65%</span></div>
                <input type="range" id="hslSatSlider" min="0" max="100" value="65">
            </div>
            <div class="control-group">
                <div class="control-label">Luz <span id="hslLightVal">50%</span></div>
                <input type="range" id="hslLightSlider" min="0" max="100" value="50">
            </div>
        </div>

        <!-- Panel OKLCH -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">OKLCH</h2>
                <div class="panel-code" id="oklchCode">oklch(50% 65% 29)</div>
            </div>
            <div class="color-display" id="oklchPreview"></div>
            
            <div class="control-group">
                <div class="control-label">Tono (Hue) <span id="oklchHueVal">29°</span></div>
                <input type="range" id="oklchHueSlider" min="0" max="360" value="29">
            </div>
            <div class="control-group">
                <div class="control-label">Croma <span id="oklchChromaVal">65%</span></div>
                <input type="range" id="oklchChromaSlider" min="0" max="100" value="65">
            </div>
            <div class="control-group">
                <div class="control-label">Luz <span id="oklchLightVal">50%</span></div>
                <input type="range" id="oklchLightSlider" min="0" max="100" value="50">
            </div>
        </div>

    </div>
</div>
<script src="/index.js"></script>
</body>
