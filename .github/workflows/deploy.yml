name: Deploy

# `main` is written by the Sync main workflow. A push made with GITHUB_TOKEN
# does not trigger another `push` workflow, so deploy on the sync run instead.
on:
  workflow_run:
    workflows: ['Sync main']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA: this job holds a Cloudflare token, so the ref is part of
      # the trust boundary and must not be a mutable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      # Fail before the build when the deployment credentials are not set, so
      # the error says what to fix instead of surfacing as a wrangler auth error.
      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN (Pages: Edit) or CLOUDFLARE_ACCOUNT_ID repository secret. Add them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The Pages project is created on first deploy; `wrangler pages deploy`
      # fails if it does not exist yet. Idempotent: lists first, creates only
      # when missing.
      - name: Ensure Pages project exists
        run: |
          projects=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          if ! echo "$projects" | jq -e '.result[] | select(.name == "senseikatana-web")' > /dev/null; then
            bunx wrangler@4.145.0 pages project create senseikatana-web --production-branch main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler@4.145.0 pages deploy web/dist --project-name senseikatana-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
