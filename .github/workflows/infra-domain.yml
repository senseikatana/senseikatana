name: Infra · apex domain

# Idempotent maintenance for the apex: points senseikatana.com at the site
# Pages project and frees the site root from the docs proxy Worker. The docs
# keep working under /en/docs — the Worker fetches them from their deployment.
#
# Run manually from the Actions tab. The job prints the state of every step so
# a missing token permission is visible instead of silent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apex:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Diagnose and point the apex at the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]')
          account=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')
          api="https://api.cloudflare.com/client/v4/accounts/${account}"
          cf="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${token}")
          json=(-H "Content-Type: application/json")
          host="senseikatana.com"
          site="senseikatana-web"

          echo "== Pages projects and domains =="
          projects=$(curl -sS "${auth[@]}" "${api}/pages/projects")
          for name in $(echo "${projects}" | jq -r '.result[].name'); do
            domains=$(curl -sS "${auth[@]}" "${api}/pages/projects/${name}/domains" || echo '{"result":[]}')
            echo "  ${name}: $(echo "${domains}" | jq -r '[.result[]? | "\(.name) [\(.status)]"] | join(", ")')"
          done

          echo "== Attach the apex to ${site} if missing =="
          mine=$(curl -sS "${auth[@]}" "${api}/pages/projects/${site}/domains")
          if echo "${mine}" | jq -e --arg host "${host}" '.result[]? | select(.name == $host)' >/dev/null; then
            echo "  already attached: $(echo "${mine}" | jq -r --arg host "${host}" '.result[] | select(.name == $host) | .status')"
          else
            curl -sS "${auth[@]}" "${json[@]}" -X POST "${api}/pages/projects/${site}/domains" \
              --data "{\"name\":\"${host}\"}" | jq -c '.result // .errors'
          fi

          echo "== Zone lookup =="
          zones=$(curl -sS -o /tmp/zones -w '%{http_code}' "${auth[@]}" "${cf}/zones?name=${host}")
          echo "  HTTP ${zones}"
          head -c 300 /tmp/zones; echo
          zone=$(jq -r '.result[0].id // empty' /tmp/zones 2>/dev/null || true)

          if [ -n "${zone}" ]; then
            echo "== Apex DNS records =="
            records=$(curl -sS -o /tmp/records -w '%{http_code}' "${auth[@]}" "${cf}/zones/${zone}/dns_records?name=${host}")
            echo "  HTTP ${records}"
            jq -c '.result[]? | {id, type, content, proxied}' /tmp/records 2>/dev/null || head -c 300 /tmp/records

            rid=$(jq -r '.result[]? | select(.type == "CNAME") | .id' /tmp/records 2>/dev/null | head -1)
            if [ -n "${rid}" ]; then
              current=$(jq -r --arg id "${rid}" '.result[] | select(.id == $id) | .content' /tmp/records)
              if [ "${current}" = "${site}.pages.dev" ]; then
                echo "  apex already points at ${site}.pages.dev"
              else
                echo "  patching apex CNAME ${current} -> ${site}.pages.dev"
                curl -sS "${auth[@]}" "${json[@]}" -X PATCH "${cf}/zones/${zone}/dns_records/${rid}" \
                  --data "{\"content\":\"${site}.pages.dev\",\"proxied\":true}" | jq -c '.success // .errors'
              fi
            else
              echo "  ::warning::no CNAME at the apex — DNS left untouched"
            fi
          else
            echo "  ::warning::zone not accessible with this token (needs DNS:Edit to change it)"
          fi

          echo "== Worker routes =="
          code=$(curl -sS -o /tmp/routes -w '%{http_code}' "${auth[@]}" "${api}/workers/routes")
          echo "  HTTP ${code}"
          head -c 400 /tmp/routes; echo
          if [ "${code}" = "200" ]; then
            for id in $(jq -r '.result[] | select(.pattern == "senseikatana.com/" or .pattern == "senseikatana.com/en" or .pattern == "senseikatana.com/en/") | .id' /tmp/routes); do
              pattern=$(jq -r --arg id "${id}" '.result[] | select(.id == $id) | .pattern' /tmp/routes)
              curl -sS "${auth[@]}" -X DELETE "${api}/workers/routes/${id}" >/dev/null
              echo "  deleted route ${pattern}"
            done
          else
            echo "  ::warning::token cannot manage Worker routes (needs Workers Routes:Edit)"
          fi

      - name: Verify the apex
        run: |
          sleep 20
          for path in / /posts /about /es/posts/ /en/docs/start/getting-started; do
            echo "${path} -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "https://senseikatana.com${path}")"
          done
