name: Infra · apex DNS

# Points senseikatana.com and www at the site Pages project, and attaches both
# as custom domains there.
#
# Why this exists: the apex and www were A/CNAME records to Surge, so every
# Pages deployment succeeded into a project nobody visited — the domain kept
# serving a stale build. This workflow is the cutover, and it is idempotent:
# run it again and it only reports.
#
# It removes ANY A, AAAA or CNAME on the two names before creating the CNAME,
# because an existing CNAME (www -> geo.surge.world) is not a conflict the API
# resolves on its own — the POST fails while the old record still exists.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would change (no writes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-dns
  cancel-in-progress: false

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      # Needed to deploy the zone Workers at the end of the cutover.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cut the apex and www over to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          token=$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]')
          account=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')
          api="https://api.cloudflare.com/client/v4/accounts/${account}"
          cf="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${token}")
          json=(-H "Content-Type: application/json")
          target="senseikatana-web.pages.dev"
          project="senseikatana-web"

          # The legacy showcase host is NOT a Pages custom domain: attaching it
          # served a full duplicate of the site. It must stay detached.
          names="senseikatana.com www.senseikatana.com"

          zone=$(curl -sS "${auth[@]}" "${cf}/zones?name=senseikatana.com" | jq -r '.result[0].id // empty')
          if [ -z "${zone}" ]; then
            echo "::error::Zone senseikatana.com not found with this token."
            exit 1
          fi
          echo "zone: ${zone} | target: ${target} | dry_run: ${DRY_RUN:-false}"

          # Recorded, not changed: Pages is an HTTPS origin, so a "flexible" zone
          # would talk to it over HTTP and loop. A cutover is the right moment to
          # notice that, not after the domain is dark.
          ssl=$(curl -sS "${auth[@]}" "${cf}/zones/${zone}/settings/ssl" | jq -r '.result.value // "unknown"')
          echo "ssl mode: ${ssl}"
          if [ "${ssl}" = "off" ] || [ "${ssl}" = "flexible" ]; then
            echo "::warning::Zone SSL mode is '${ssl}'. Pages expects Full or Full (strict); set it in the dashboard if the site loops after cutover."
          fi

          for name in ${names}; do
            echo "== ${name} =="
            records=$(curl -sS "${auth[@]}" "${cf}/zones/${zone}/dns_records?name=${name}")

            if echo "${records}" | jq -e --arg t "${target}" \
              '.result[]? | select(.type == "CNAME" and .content == $t and .proxied == true)' >/dev/null; then
              echo "  ok: already a proxied CNAME to ${target}"
              continue
            fi

            # Only A/AAAA/CNAME can occupy the name we need. MX, TXT and the rest
            # belong to mail and verification and must survive.
            echo "${records}" | jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME")
              | "  stale: \(.type) \(.name) -> \(.content) (proxied=\(.proxied))"'

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "  would delete the records above and create CNAME -> ${target}"
              continue
            fi

            for id in $(echo "${records}" | jq -r '.result[]? | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id'); do
              curl -sS "${auth[@]}" -X DELETE "${cf}/zones/${zone}/dns_records/${id}" \
                | jq -c '{deleted: .result.id, ok: .success}'
            done

            body=$(jq -nc --arg n "${name}" --arg c "${target}" \
              '{type:"CNAME", name:$n, content:$c, proxied:true, ttl:1}')
            created=$(curl -sS "${auth[@]}" "${json[@]}" -X POST "${cf}/zones/${zone}/dns_records" --data "${body}")
            echo "${created}" | jq -c '{success, errors, result: (.result | {type, name, content, proxied})}'
            echo "${created}" | jq -e '.success' >/dev/null || {
              echo "::error::Could not create the CNAME for ${name}"
              exit 1
            }
          done

          echo "== Pages custom domains =="
          # A domain that was attached while DNS still pointed elsewhere stays
          # `deactivated`, and a deactivated domain makes Cloudflare resolve the
          # CNAME externally instead of routing to Pages — the symptom is 522.
          # Re-adding it is what re-triggers validation.
          project_info=$(curl -sS "${auth[@]}" "${api}/pages/projects/${project}")
          echo "  production_branch: $(echo "${project_info}" | jq -r '.result.production_branch // "?"')"
          echo "  latest deploy env: $(echo "${project_info}" | jq -r '.result.latest_deployment.environment // "?"') (branch $(echo "${project_info}" | jq -r '.result.latest_deployment.deployment_trigger.metadata.branch // "?"'))"

          for name in ${names}; do
            domains=$(curl -sS "${auth[@]}" "${api}/pages/projects/${project}/domains")
            status=$(echo "${domains}" | jq -r --arg n "$name" '.result[]? | select(.name == $n) | .status')
            if [ "${status}" = "active" ]; then
              echo "  ${name}: active"
              continue
            fi
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "  ${name}: status '${status:-absent}' -> would re-add"
              continue
            fi
            if [ -n "${status}" ]; then
              echo "  ${name}: status '${status}' -> removing to re-trigger validation"
              curl -sS "${auth[@]}" -X DELETE "${api}/pages/projects/${project}/domains/${name}" | jq -c '.errors'
            fi
            echo "  ${name}: attaching"
            curl -sS "${auth[@]}" "${json[@]}" -X POST "${api}/pages/projects/${project}/domains" \
              --data "$(jq -nc --arg n "${name}" '{name:$n}')" \
              | jq -c '{name: .result.name, status: .result.status, errors}'
          done

          # The legacy showcase host must NOT stay attached: an attached domain
          # serves the whole site, which is how the apex leaked onto the
          # subdomain. Detach it if it is still there.
          stale_showcase=$(curl -sS "${auth[@]}" "${api}/pages/projects/${project}/domains" \
            | jq -r '.result[]? | select(.name == "showcase.senseikatana.com") | .name')
          if [ -n "${stale_showcase}" ]; then
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "  showcase.senseikatana.com: would detach (it serves a duplicate of the site)"
            else
              echo "  showcase.senseikatana.com: detaching"
              curl -sS "${auth[@]}" -X DELETE \
                "${api}/pages/projects/${project}/domains/showcase.senseikatana.com" | jq -c '.errors'
            fi
          fi

          echo "== waiting for activation =="
          if [ "${DRY_RUN:-false}" != "true" ]; then
            for i in $(seq 1 12); do
              domains=$(curl -sS "${auth[@]}" "${api}/pages/projects/${project}/domains")
              s=$(echo "${domains}" | jq -r '[.result[]? | "\(.name)=\(.status)"] | join(" ")')
              echo "  ${s}"
              echo "${s}" | grep -q "deactivated\|pending" || break
              sleep 10
            done
          fi

      # Turning the proxy on activates every Worker route on the zone, so the
      # Worker copy that is live the moment DNS moves is the one answering.
      - name: Deploy the zone Workers
        if: ${{ inputs.dry_run != true }}
        # The current token has Pages + DNS but not "Workers Scripts: Edit", so
        # this fails with a 403 on the service. It must not abort the cutover:
        # deploy `bun run deploy:proxy` with a token that has Workers Scripts
        # permission to serve /docs. The route is owned by workers/docs-proxy.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          for cfg in workers/docs-proxy/wrangler.jsonc; do
            echo "== ${cfg} =="
            bunx wrangler@4.162.0 deploy -c "${cfg}" || echo "::warning::${cfg} not deployed (token lacks Workers Scripts: Edit?)"
          done

      - name: Verify the new build is actually served
        if: ${{ inputs.dry_run != true }}
        run: |
          # Deployment is instant but DNS/propagation is not: poll instead of a
          # fixed sleep, and assert a marker only the new build has.
          for i in $(seq 1 24); do
            html=$(curl -s --max-time 10 https://senseikatana.com/ || true)
            if echo "${html}" | grep -q 'href="/works' && ! echo "${html}" | grep -q 'samuraicoder.dev'; then
              echo "new build detected after $((i*5))s"
              break
            fi
            [ "$i" = "24" ] && { echo "::error::senseikatana.com still serves the old build"; exit 1; }
            sleep 5
          done

          echo "== routes =="
          for path in / /posts /about /services /projects/empresaplana /works /works/empresaplana /ca/works /es/works /docs/overview; do
            printf '%-26s %s\n' "${path}" \
              "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "https://senseikatana.com${path}")"
          done

          echo "== www =="
          curl -s -o /dev/null -w 'www %{http_code} %{redirect_url}\n' --max-time 10 https://www.senseikatana.com/
