name: Infra · apex DNS

# Ensures the apex and www point at the site Pages project. The Worker custom
# domains were removed and the docs proxy now only owns /en/docs*.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure apex CNAMEs and Pages domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]')
          account=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')
          api="https://api.cloudflare.com/client/v4/accounts/${account}"
          cf="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${token}")
          json=(-H "Content-Type: application/json")
          target="senseikatana-web.pages.dev"

          zone=$(curl -sS "${auth[@]}" "${cf}/zones?name=senseikatana.com" | jq -r '.result[0].id')
          echo "zone: ${zone}"

          for name in senseikatana.com www.senseikatana.com; do
            echo "== ${name} =="
            records=$(curl -sS "${auth[@]}" "${cf}/zones/${zone}/dns_records?name=${name}")
            if echo "${records}" | jq -e --arg target "${target}" '.result[]? | select(.type == "CNAME" and .content == $target)' >/dev/null; then
              echo "  CNAME already points at ${target}"
            else
              for id in $(echo "${records}" | jq -r '.result[]? | select(.type == "A" or .type == "AAAA") | .id'); do
                echo "  removing stale $(echo "${records}" | jq -r --arg id "$id" '.result[] | select(.id == $id) | "\(.type) \(.content)"')"
                curl -sS "${auth[@]}" -X DELETE "${cf}/zones/${zone}/dns_records/${id}" | jq -c '.success // .errors'
              done
              echo "  creating CNAME ${name} -> ${target}"
              curl -sS "${auth[@]}" "${json[@]}" -X POST "${cf}/zones/${zone}/dns_records" \
                --data "{\"type\":\"CNAME\",\"name\":\"${name}\",\"content\":\"${target}\",\"proxied\":true,\"ttl\":1}" |
                jq -c '{success, errors, result: (.result | {type, name, content, proxied})}'
            fi
          done

          echo "== Pages domains =="
          domains=$(curl -sS "${auth[@]}" "${api}/pages/projects/senseikatana-web/domains")
          for name in senseikatana.com www.senseikatana.com; do
            if echo "${domains}" | jq -e --arg name "$name" '.result[]? | select(.name == $name)' >/dev/null; then
              echo "  ${name}: attached ($(echo "${domains}" | jq -r --arg name "$name" '.result[] | select(.name == $name) | .status'))"
            else
              echo "  ${name}: attaching"
              curl -sS "${auth[@]}" "${json[@]}" -X POST "${api}/pages/projects/senseikatana-web/domains" \
                --data "{\"name\":\"${name}\"}" | jq -c '.result // .errors'
            fi
          done

      - name: Verify
        run: |
          sleep 60
          for path in / /posts /about /es/posts/ /en/docs/ /en/docs/start/getting-started; do
            echo "${path} -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "https://senseikatana.com${path}")"
          done
